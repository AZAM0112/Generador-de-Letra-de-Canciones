name: Generar videos de letras

# Se ejecuta a mano: pestaña Actions -> "Generar videos de letras" -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      forzar:
        description: "Rehacer también los videos que ya existen"
        type: boolean
        default: false
      modelo:
        description: "Modelo Whisper (small = rápido, medium = recomendado, large-v3 = el más preciso y lento)"
        type: string
        default: medium

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: generador_letras/requirements.txt

      - name: Instalar fuente y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install -r generador_letras/requirements.txt

      - name: Guardar en caché el modelo de Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.modelo }}

      - name: Generar videos
        run: python generar.py canciones --modelo "${{ inputs.modelo }}" ${{ inputs.forzar && '--forzar' || '' }}

      - name: Subir videos y letras
        uses: actions/upload-artifact@v4
        with:
          name: videos-de-letras
          path: |
            canciones/*_letra.mp4
            canciones/*_letra.letra.json
          if-no-files-found: warn
